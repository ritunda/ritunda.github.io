<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>📚 books · admin · multi-page</title>
    <!-- fonts & icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0f1a2b 0%, #1a2c42 100%);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem;
        }

        /* browser window */
        .browser {
            width: 100%;
            height: 100%;
            max-width: 1400px;
            max-height: 850px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* browser top bar */
        .browser-top {
            background: #f1f5f9;
            border-bottom: 1px solid #cbd5e1;
            padding: 0.6rem 1rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
            flex-shrink: 0;
        }

        .window-dots {
            display: flex;
            gap: 0.5rem;
            margin-right: 0.25rem;
        }
        .window-dots span {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background-color: #e34b4b;
        }
        .window-dots span:nth-child(2) { background: #f5b342; }
        .window-dots span:nth-child(3) { background: #5fc452; }

        .tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            flex: 1 1 auto;
        }
        .tab {
            background: rgba(203, 213, 225, 0.5);
            border-radius: 30px;
            padding: 0.35rem 1.1rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1f3a5f;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border: 1px solid transparent;
            cursor: default;
        }
        .tab.active {
            background: white;
            border-color: #acc6e3;
            color: #0e293f;
        }

        /* address bar with dropdown + admin button */
        .address-bar {
            background: white;
            border-radius: 40px;
            padding: 0.3rem 0.3rem 0.3rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            border: 1px solid #b9cfec;
            flex: 2 1 380px;
            color: #1f3a5f;
        }
        .address-bar i { color: #3f6ca0; }
        .address-bar .url {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.85rem;
        }
        
        .book-dropdown {
            background: #e9eff7;
            border: none;
            border-radius: 30px;
            padding: 0.3rem 1.8rem 0.3rem 1rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1f3d5e;
            cursor: pointer;
            border: 1px solid #b9cfec;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%231f3d5e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 14px;
            min-width: 160px;
        }

        .admin-icon-btn {
            background: #1f3d5e;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 0.3rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }
        .admin-icon-btn:hover { background: #2b527c; }

        /* main content */
        .browser-content {
            padding: 1.5rem 2rem 1.5rem;
            background: white;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 1rem;
            flex-shrink: 0;
        }
        .page-header h2 {
            font-weight: 600;
            font-size: 1.6rem;
            color: #0a253b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* book detail area */
        .book-detail {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .book-detail-card {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid #eef3fa;
            box-shadow: 0 15px 35px -10px rgba(0,20,50,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .detail-cover {
            width: 200px;
            height: 260px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.2);
        }
        .detail-cover-placeholder {
            width: 200px;
            height: 260px;
            border-radius: 20px;
            background: linear-gradient(145deg, #eef3f8, #dde6f2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c86a3;
            margin-bottom: 1.5rem;
        }
        
        .detail-title {
            font-size: 2rem;
            font-weight: 700;
            color: #0a253b;
            text-align: center;
            margin-bottom: 0.3rem;
        }
        .detail-author {
            font-size: 1.1rem;
            font-weight: 500;
            color: #4d6a8f;
            margin-bottom: 1rem;
            border-left: 4px solid #b7d0ed;
            padding-left: 1rem;
        }
        .detail-desc {
            font-size: 1rem;
            color: #2e445e;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .detail-github {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            background: #1f3d5e;
            color: white;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .detail-github:hover { background: #2b527c; }
        
        /* admin buttons on book page */
        .admin-book-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .edit-btn, .delete-btn {
            border: none;
            border-radius: 40px;
            padding: 0.5rem 1.5rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .edit-btn { background: #e9eff7; color: #1f3d5e; }
        .delete-btn { background: #fee; color: #b91c1c; }
        .edit-btn:hover { background: #d4e2f5; }
        .delete-btn:hover { background: #fdd; }

        /* book list grid */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            width: 100%;
        }
        .grid-item {
            background: #f9fcff;
            border-radius: 20px;
            padding: 1.2rem;
            border: 1px solid #e2ebf6;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .grid-cover {
            width: 100px;
            height: 130px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 0.8rem;
        }
        .grid-title {
            font-weight: 700;
            color: #1f3d5e;
            font-size: 1rem;
        }
        .preview-link {
            background: #e9eff7;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            color: #1f3d5e;
            text-decoration: none;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: inline-block;
        }

        /* admin modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            border-radius: 36px;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h3 {
            font-size: 1.5rem;
            color: #0a253b;
            margin-bottom: 1.2rem;
        }
        .modal input, .modal textarea {
            width: 100%;
            padding: 0.7rem 1.2rem;
            border: 1px solid #cbd5e1;
            border-radius: 30px;
            font-family: inherit;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1rem;
        }
        .modal-btn {
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
        }
        .modal-btn.primary { background: #1f3d5e; color: white; }
        .modal-btn.secondary { background: #e2e8f0; color: #1e293b; }
        .modal-btn.danger { background: #dc2626; color: white; }

        .footer {
            margin-top: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #dfe8f2;
            padding-top: 1rem;
            color: #4d6582;
            flex-shrink: 0;
            font-size: 0.85rem;
        }
        .footer a { color: #1f4973; text-decoration: none; }
    </style>
</head>
<body>
<div class="browser">
    <!-- browser top bar -->
    <div class="browser-top">
        <div class="window-dots"><span></span><span></span><span></span></div>
        <div class="tabs">
            <span class="tab active"><i class="fas fa-book"></i> Bookshelf</span>
            <span class="tab"><i class="fas fa-user-shield"></i> Admin</span>
        </div>
        <div class="address-bar">
            <i class="fas fa-lock"></i>
            <span class="url" id="currentUrl">index.html</span>
            <select id="bookDropdown" class="book-dropdown">
                <option value="index">📋 Book list (index)</option>
            </select>
            <button class="admin-icon-btn" id="adminLoginBtn"><i class="fas fa-lock"></i> admin</button>
        </div>
    </div>

    <!-- main content area -->
    <div class="browser-content">
        <div class="page-header">
            <h2><i class="fas fa-book-open"></i> <span id="pageTitle">book browser</span></h2>
            <div id="adminHeaderBtn" style="display: none;">
                <button class="admin-icon-btn" id="addBookBtn"><i class="fas fa-plus"></i> add book</button>
            </div>
        </div>

        <!-- dynamic content -->
        <div id="dynamicContent" class="book-detail"></div>

        <!-- footer -->
        <div class="footer">
            <div class="same-tab-note"><i class="fas fa-link"></i> all links open in same tab</div>
            <div><i class="fab fa-github"></i> <a href="https://github.com" target="_blank">github.com</a></div>
        </div>
    </div>

    <!-- admin login modal -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal">
            <h3><i class="fas fa-shield-alt"></i> admin login</h3>
            <input type="password" id="adminPassword" placeholder="enter password (admin123)" />
            <div class="modal-actions">
                <button class="modal-btn secondary" id="closeModalBtn">cancel</button>
                <button class="modal-btn primary" id="unlockBtn">unlock</button>
            </div>
        </div>
    </div>

    <!-- add/edit book modal -->
    <div class="modal-overlay" id="bookModal">
        <div class="modal">
            <h3 id="bookModalTitle">add new book</h3>
            <input type="text" id="bookTitle" placeholder="book title" />
            <input type="text" id="bookAuthor" placeholder="author" />
            <textarea id="bookDesc" placeholder="description"></textarea>
            <input type="url" id="githubUrl" placeholder="github repository url" />
            <input type="url" id="coverUrl" placeholder="cover image url (optional)" />
            <input type="hidden" id="editingBookId" value="" />
            <div class="modal-actions">
                <button class="modal-btn secondary" id="cancelBookBtn">cancel</button>
                <button class="modal-btn primary" id="saveBookBtn">save book</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- DATA STORAGE (localStorage) ----------
        let books = [];
        let isAdmin = false;
        const ADMIN_PASSWORD = 'admin123';

        // Load books from localStorage or use defaults
        function loadBooks() {
            const stored = localStorage.getItem('books');
            if (stored) {
                books = JSON.parse(stored);
            } else {
                // Default books
                books = [
                    { id: 'book1', title: 'You Don\'t Know JS', author: 'Kyle Simpson', description: 'Deep dive into JavaScript\'s core mechanics.', github: 'https://github.com/getify/You-Dont-Know-JS', cover: 'https://m.media-amazon.com/images/I/71T9I9iF-EL._AC_UF1000,1000_QL80_.jpg' },
                    { id: 'book2', title: 'Eloquent JavaScript', author: 'Marijn Haverbeke', description: 'Modern introduction to programming and JavaScript.', github: 'https://github.com/marijnh/Eloquent-JavaScript', cover: 'https://m.media-amazon.com/images/I/91asIC1fRwL._AC_UF1000,1000_QL80_.jpg' },
                    { id: 'book3', title: 'Pro Git', author: 'Scott Chacon, Ben Straub', description: 'The authoritative Git book, fully open source.', github: 'https://github.com/progit/progit2', cover: 'https://git-scm.com/images/progit2.png' }
                ];
                saveBooks();
            }
            updateDropdown();
        }

        function saveBooks() {
            localStorage.setItem('books', JSON.stringify(books));
            updateDropdown();
            // refresh current view
            const current = document.getElementById('bookDropdown').value;
            navigateTo(current);
        }

        // Update dropdown menu
        function updateDropdown() {
            const dropdown = document.getElementById('bookDropdown');
            dropdown.innerHTML = '<option value="index">📋 Book list (index)</option>';
            books.forEach(book => {
                const option = document.createElement('option');
                option.value = book.id;
                option.textContent = `📘 ${book.title}`;
                dropdown.appendChild(option);
            });
        }

        // Find book by id
        function getBook(id) {
            return books.find(b => b.id === id);
        }

        // Generate new unique id
        function generateId() {
            return 'book' + Date.now() + Math.random().toString(36).substr(2, 4);
        }

        // ---------- RENDERING ----------
        function renderBookList() {
            let html = '<div class="books-grid">';
            books.forEach(book => {
                html += `
                    <div class="grid-item">
                        <img src="${book.cover || ''}" alt="cover" class="grid-cover" onerror="this.src='https://via.placeholder.com/100x130?text=📖'">
                        <div class="grid-title">${escapeHtml(book.title)}</div>
                        <div style="font-size:0.75rem; color:#607a99;">${escapeHtml(book.author)}</div>
                        <a href="#" data-book="${book.id}" class="preview-link preview-link-item">view details →</a>
                        ${isAdmin ? `
                            <div style="margin-top:0.5rem; display:flex; gap:0.5rem;">
                                <button class="edit-btn" data-id="${book.id}" style="padding:0.2rem 0.8rem; font-size:0.7rem;"><i class="fas fa-edit"></i> edit</button>
                                <button class="delete-btn" data-id="${book.id}" style="padding:0.2rem 0.8rem; font-size:0.7rem;"><i class="fas fa-trash"></i> del</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            html += '</div>';
            return html;
        }

        function renderBookDetail(bookId) {
            const book = getBook(bookId);
            if (!book) return '<div class="error">Book not found</div>';
            
            const coverHtml = book.cover 
                ? `<img src="${book.cover}" class="detail-cover" onerror="this.src='https://via.placeholder.com/200x260?text=📖'">`
                : `<div class="detail-cover-placeholder"><i class="fas fa-book" style="font-size:2rem;"></i></div>`;
            
            let actions = '';
            if (isAdmin) {
                actions = `
                    <div class="admin-book-actions">
                        <button class="edit-btn" data-id="${book.id}"><i class="fas fa-edit"></i> edit book</button>
                        <button class="delete-btn" data-id="${book.id}"><i class="fas fa-trash"></i> delete book</button>
                    </div>
                `;
            }
            
            return `
                <div class="book-detail-card">
                    ${coverHtml}
                    <div class="detail-title">${escapeHtml(book.title)}</div>
                    <div class="detail-author">${escapeHtml(book.author)}</div>
                    <div class="detail-desc">${escapeHtml(book.description)}</div>
                    <a href="${escapeHtml(book.github)}" class="detail-github" target="_self"><i class="fab fa-github"></i> repository</a>
                    ${actions}
                    <div class="back-link" style="margin-top:1rem;">← <a href="#" id="backToList">back to list (index.html)</a></div>
                </div>
            `;
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return String(unsafe).replace(/[&<>"]/g, function(m) {
                if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; if(m === '"') return '&quot;';
                return m;
            });
        }

        // ---------- NAVIGATION ----------
        function navigateTo(page) {
            const content = document.getElementById('dynamicContent');
            const urlSpan = document.getElementById('currentUrl');
            const titleSpan = document.getElementById('pageTitle');
            
            if (page === 'index') {
                content.innerHTML = renderBookList();
                urlSpan.textContent = 'index.html';
                titleSpan.textContent = 'all books';
                attachListEvents();
            } else {
                content.innerHTML = renderBookDetail(page);
                urlSpan.textContent = page + '.html';
                const book = getBook(page);
                titleSpan.textContent = book ? book.title : 'book details';
                attachDetailEvents(page);
            }
        }

        // Event binding
        function attachListEvents() {
            document.querySelectorAll('.preview-link-item').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const id = link.dataset.book;
                    document.getElementById('bookDropdown').value = id;
                    navigateTo(id);
                });
            });
            if (isAdmin) {
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        openEditBookModal(id);
                    });
                });
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        if (confirm('Delete this book?')) {
                            books = books.filter(b => b.id !== id);
                            saveBooks();
                            navigateTo('index');
                        }
                    });
                });
            }
        }

        function attachDetailEvents(bookId) {
            const backLink = document.getElementById('backToList');
            if (backLink) {
                backLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.getElementById('bookDropdown').value = 'index';
                    navigateTo('index');
                });
            }
            if (isAdmin) {
                const editBtn = document.querySelector('.edit-btn[data-id]');
                if (editBtn) {
                    editBtn.addEventListener('click', () => openEditBookModal(bookId));
                }
                const deleteBtn = document.querySelector('.delete-btn[data-id]');
                if (deleteBtn) {
                    deleteBtn.addEventListener('click', () => {
                        if (confirm('Delete this book?')) {
                            books = books.filter(b => b.id !== bookId);
                            saveBooks();
                            navigateTo('index');
                        }
                    });
                }
            }
        }

        // ---------- ADMIN MODALS ----------
        const adminModal = document.getElementById('adminModal');
        const bookModal = document.getElementById('bookModal');
        const adminLoginBtn = document.getElementById('adminLoginBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const unlockBtn = document.getElementById('unlockBtn');
        const addBookBtn = document.getElementById('addBookBtn');
        const cancelBookBtn = document.getElementById('cancelBookBtn');
        const saveBookBtn = document.getElementById('saveBookBtn');
        const adminPassword = document.getElementById('adminPassword');
        const bookTitle = document.getElementById('bookTitle');
        const bookAuthor = document.getElementById('bookAuthor');
        const bookDesc = document.getElementById('bookDesc');
        const githubUrl = document.getElementById('githubUrl');
        const coverUrl = document.getElementById('coverUrl');
        const editingBookId = document.getElementById('editingBookId');
        const bookModalTitle = document.getElementById('bookModalTitle');
        const adminHeaderBtn = document.getElementById('adminHeaderBtn');

        function openEditBookModal(id) {
            const book = getBook(id);
            if (book) {
                bookModalTitle.textContent = 'edit book';
                bookTitle.value = book.title || '';
                bookAuthor.value = book.author || '';
                bookDesc.value = book.description || '';
                githubUrl.value = book.github || '';
                coverUrl.value = book.cover || '';
                editingBookId.value = id;
                bookModal.style.display = 'flex';
            }
        }

        function resetBookModal() {
            bookModalTitle.textContent = 'add new book';
            bookTitle.value = '';
            bookAuthor.value = '';
            bookDesc.value = '';
            githubUrl.value = '';
            coverUrl.value = '';
            editingBookId.value = '';
        }

        // Admin login
        adminLoginBtn.addEventListener('click', () => {
            adminModal.style.display = 'flex';
            adminPassword.value = '';
        });

        closeModalBtn.addEventListener('click', () => {
            adminModal.style.display = 'none';
        });

        unlockBtn.addEventListener('click', () => {
            if (adminPassword.value === ADMIN_PASSWORD) {
                isAdmin = true;
                adminModal.style.display = 'none';
                adminHeaderBtn.style.display = 'block';
                adminLoginBtn.innerHTML = '<i class="fas fa-check"></i> admin';
                // refresh current view to show admin buttons
                navigateTo(document.getElementById('bookDropdown').value);
            } else {
                alert('incorrect password');
            }
        });

        addBookBtn.addEventListener('click', () => {
            resetBookModal();
            bookModal.style.display = 'flex';
        });

        cancelBookBtn.addEventListener('click', () => {
            bookModal.style.display = 'none';
        });

        saveBookBtn.addEventListener('click', () => {
            const title = bookTitle.value.trim();
            const author = bookAuthor.value.trim();
            const desc = bookDesc.value.trim();
            const github = githubUrl.value.trim();
            const cover = coverUrl.value.trim();
            const editId = editingBookId.value;

            if (!title || !author || !desc || !github) {
                alert('title, author, description and github link are required');
                return;
            }

            if (editId) {
                // edit existing
                const index = books.findIndex(b => b.id === editId);
                if (index !== -1) {
                    books[index] = { ...books[index], title, author, description: desc, github, cover };
                }
            } else {
                // new book
                const newBook = {
                    id: generateId(),
                    title,
                    author,
                    description: desc,
                    github,
                    cover
                };
                books.push(newBook);
            }

            saveBooks();
            bookModal.style.display = 'none';
            navigateTo(document.getElementById('bookDropdown').value);
        });

        // click outside to close modals
        window.addEventListener('click', (e) => {
            if (e.target === adminModal) adminModal.style.display = 'none';
            if (e.target === bookModal) bookModal.style.display = 'none';
        });

        // dropdown navigation
        document.getElementById('bookDropdown').addEventListener('change', (e) => {
            navigateTo(e.target.value);
        });

        // initial load
        loadBooks();
        navigateTo('index');
    })();
</script>
</body>
</html>
