<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>St. Camillus Families • Alumni Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #f4f2ee; scroll-behavior: smooth; }
    .vote-column { min-width: 48px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .vote-arrow { cursor: pointer; transition: all 0.2s; color: #878a8c; font-size: 1.5rem; line-height: 1; }
    .vote-arrow:hover { color: #ff4500; transform: scale(1.1); }
    .vote-count { font-weight: 600; font-size: 0.9rem; color: #1c1c1c; }
    .post-card { transition: all 0.25s ease; }
    .post-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    .btn-primary { background-color: #0a66c2; color: white; border-radius: 9999px; padding: 8px 20px; font-weight: 600; transition: background 0.2s; }
    .btn-primary:hover { background-color: #004182; }
    .btn-outline { border: 1px solid #0a66c2; color: #0a66c2; background: white; border-radius: 9999px; padding: 6px 16px; font-weight: 600; transition: all 0.2s; }
    .btn-outline:hover { background: #e8f0fe; }
    .tab-active { border-bottom: 2px solid #0a66c2; color: #0a66c2; font-weight: 600; }
    .profile-cover { background: linear-gradient(135deg, #0a66c2, #004182); height: 120px; border-radius: 1rem 1rem 0 0; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-up { animation: fadeInUp 0.4s ease-out; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #e9e9e9; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #b3b3b3; border-radius: 10px; }
    .like-btn, .save-btn { transition: all 0.2s; cursor: pointer; }
    .like-btn:hover, .save-btn:hover { transform: scale(1.05); }
    .comment-vote { font-size: 0.8rem; cursor: pointer; transition: all 0.1s; }
    .comment-vote:hover { transform: scale(1.1); }
    .dropdown { position: relative; display: inline-block; }
    .dropdown-content { display: none; position: absolute; right: 0; background-color: white; min-width: 120px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); border-radius: 8px; z-index: 1; }
    .dropdown-content a { color: black; padding: 8px 12px; text-decoration: none; display: block; font-size: 0.8rem; }
    .dropdown-content a:hover { background-color: #f1f1f1; }
  </style>
</head>
<body>

  <!-- Auth Container -->
  <div id="authContainer" class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 animate-fade-up">
      <div class="text-center mb-6">
        <i class="fa-solid fa-hand-holding-heart text-4xl text-[#0a66c2]"></i>
        <h2 class="text-2xl font-bold mt-2">St. Camillus Families</h2>
        <p class="text-gray-500">Enter your invite code to continue</p>
      </div>
      <div id="inviteStep">
        <input type="text" id="inviteCode" placeholder="Invite Code" class="w-full p-3 border border-gray-300 rounded-lg mb-4">
        <button onclick="verifyInviteCode()" class="btn-primary w-full">Verify</button>
      </div>
      <div id="authStep" class="hidden">
        <div class="flex gap-2 mb-4">
          <button id="showLoginBtn" class="flex-1 py-2 border-b-2 border-[#0a66c2] font-semibold">Login</button>
          <button id="showSignupBtn" class="flex-1 py-2 text-gray-500">Sign Up</button>
        </div>
        <div id="loginForm">
          <input type="email" id="loginEmail" placeholder="Email" class="w-full p-3 border border-gray-300 rounded-lg mb-3">
          <input type="password" id="loginPassword" placeholder="Password" class="w-full p-3 border border-gray-300 rounded-lg mb-4">
          <button onclick="login()" class="btn-primary w-full">Login</button>
        </div>
        <div id="signupForm" class="hidden">
          <input type="email" id="signupEmail" placeholder="Email" class="w-full p-3 border border-gray-300 rounded-lg mb-3">
          <input type="password" id="signupPassword" placeholder="Password" class="w-full p-3 border border-gray-300 rounded-lg mb-4">
          <button onclick="signup()" class="btn-primary w-full">Sign Up</button>
        </div>
      </div>
      <div id="errorMsg" class="text-red-600 text-sm mt-4 text-center"></div>
    </div>
  </div>

  <!-- Main App -->
  <div id="appContainer" class="hidden">
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-hand-holding-heart text-3xl text-[#0a66c2]"></i>
            <span class="text-xl font-bold text-gray-900 hidden sm:inline">St. Camillus Families</span>
            <span class="text-xl font-bold text-gray-900 sm:hidden">SCF</span>
          </div>
          <div class="flex-1 max-w-md mx-4 hidden md:block">
            <div class="relative">
              <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <input id="globalSearch" type="text" placeholder="Search alumni, jobs, events..." class="w-full pl-10 pr-4 py-2 rounded-full bg-gray-100 border border-transparent focus:border-[#0a66c2] focus:bg-white focus:outline-none">
            </div>
          </div>
          <div class="flex items-center gap-2 sm:gap-4">
            <nav class="hidden md:flex gap-1">
              <button id="navFeed" class="tab-btn px-3 py-1 rounded-full text-gray-600 hover:bg-gray-100">Feed</button>
              <button id="navDirectory" class="tab-btn px-3 py-1 rounded-full text-gray-600 hover:bg-gray-100">Directory</button>
              <button id="navJobs" class="tab-btn px-3 py-1 rounded-full text-gray-600 hover:bg-gray-100">Jobs</button>
              <button id="navMentorship" class="tab-btn px-3 py-1 rounded-full text-gray-600 hover:bg-gray-100">Mentorship</button>
              <button id="navEvents" class="tab-btn px-3 py-1 rounded-full text-gray-600 hover:bg-gray-100">Events</button>
              <button id="navMessages" class="tab-btn px-3 py-1 rounded-full text-gray-600 hover:bg-gray-100">Messages</button>
              <button id="navAdmin" class="tab-btn px-3 py-1 rounded-full text-gray-600 hover:bg-gray-100 hidden">Admin</button>
            </nav>
            <div class="relative cursor-pointer" id="notifIcon">
              <i class="fa-regular fa-bell text-2xl text-gray-600"></i>
              <span id="notifBadge" class="absolute -top-1 -right-2 bg-red-600 text-white text-[10px] font-bold px-1.5 rounded-full">0</span>
            </div>
            <div id="profileBtn" class="flex items-center gap-2 cursor-pointer bg-gray-100 rounded-full pl-1 pr-3 py-1 hover:bg-gray-200 transition">
              <div class="w-8 h-8 bg-[#0a66c2] rounded-full flex items-center justify-center text-white font-bold text-sm">👤</div>
              <span class="text-sm font-medium text-gray-700 hidden sm:inline" id="userNameDisplay">Alumni</span>
            </div>
            <button id="logoutBtn" class="text-sm text-gray-500 hover:text-red-600 ml-2">Logout</button>
          </div>
        </div>
      </div>
      <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 z-50">
        <button id="mobileFeed" class="flex flex-col items-center text-xs text-gray-600"><i class="fa-solid fa-house text-xl"></i><span>Feed</span></button>
        <button id="mobileDirectory" class="flex flex-col items-center text-xs text-gray-600"><i class="fa-solid fa-users text-xl"></i><span>Directory</span></button>
        <button id="mobileJobs" class="flex flex-col items-center text-xs text-gray-600"><i class="fa-solid fa-briefcase text-xl"></i><span>Jobs</span></button>
        <button id="mobileMentorship" class="flex flex-col items-center text-xs text-gray-600"><i class="fa-solid fa-handshake text-xl"></i><span>Mentor</span></button>
        <button id="mobileEvents" class="flex flex-col items-center text-xs text-gray-600"><i class="fa-solid fa-calendar text-xl"></i><span>Events</span></button>
        <button id="mobileMessages" class="flex flex-col items-center text-xs text-gray-600"><i class="fa-solid fa-envelope text-xl"></i><span>Messages</span></button>
        <button id="mobileAdmin" class="flex flex-col items-center text-xs text-gray-600 hidden"><i class="fa-solid fa-gavel text-xl"></i><span>Admin</span></button>
      </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-20 md:pb-6">
      <div id="appContent"></div>
    </div>

    <!-- Modals (same as before) -->
    <div id="postModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl max-w-2xl w-full shadow-xl animate-fade-up">
        <div class="px-6 py-4 border-b flex justify-between items-center">
          <h2 class="text-xl font-bold">Create a post</h2>
          <i onclick="closePostModal()" class="fa-solid fa-xmark cursor-pointer text-gray-500 hover:text-gray-700"></i>
        </div>
        <div class="p-6">
          <textarea id="postContent" rows="5" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#0a66c2]" placeholder="Share something with the community..."></textarea>
          <div class="mt-3 flex flex-wrap gap-4">
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="anonymousPost"> Post anonymously</label>
            <select id="postSpecialty" class="border border-gray-300 rounded-full px-3 py-1 text-sm">
              <option value="">Specialty (optional)</option>
              <option>ICU</option><option>ER</option><option>Pediatrics</option><option>Oncology</option>
            </select>
          </div>
          <div onclick="document.getElementById('postImage').click()" class="mt-6 border-2 border-dashed border-gray-300 rounded-2xl p-6 text-center cursor-pointer hover:border-[#0a66c2] transition">
            <input type="file" id="postImage" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
            <i class="fa-solid fa-cloud-upload-alt text-4xl text-gray-400"></i>
            <div id="imageNameDisplay" class="mt-2 text-sm text-gray-500"></div>
          </div>
        </div>
        <div class="px-6 py-4 border-t flex justify-end">
          <button onclick="publishPost()" class="btn-primary">Post</button>
        </div>
      </div>
    </div>

    <!-- Edit Post Modal, Message Modal, Report Modal, Job Modal, Event Modal (same as before) -->
    <!-- (I'll keep them minimal for brevity; the full version is in previous messages) -->
    <div id="editPostModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl max-w-2xl w-full shadow-xl animate-fade-up">
        <div class="px-6 py-4 border-b flex justify-between items-center">
          <h2 class="text-xl font-bold">Edit Post</h2>
          <i onclick="closeEditPostModal()" class="fa-solid fa-xmark cursor-pointer text-gray-500 hover:text-gray-700"></i>
        </div>
        <div class="p-6">
          <textarea id="editPostContent" rows="5" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#0a66c2]"></textarea>
          <div class="mt-3 flex flex-wrap gap-4">
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="editAnonymousPost"> Post anonymously</label>
            <select id="editPostSpecialty" class="border border-gray-300 rounded-full px-3 py-1 text-sm">
              <option value="">Specialty (optional)</option>
              <option>ICU</option><option>ER</option><option>Pediatrics</option><option>Oncology</option>
            </select>
          </div>
          <div onclick="document.getElementById('editPostImage').click()" class="mt-6 border-2 border-dashed border-gray-300 rounded-2xl p-6 text-center cursor-pointer hover:border-[#0a66c2] transition">
            <input type="file" id="editPostImage" accept="image/*" class="hidden" onchange="handleEditImageSelect(event)">
            <div id="editImageNameDisplay" class="mt-2 text-sm text-gray-500"></div>
          </div>
        </div>
        <div class="px-6 py-4 border-t flex justify-end">
          <button onclick="saveEditedPost()" class="btn-primary">Save Changes</button>
        </div>
      </div>
    </div>

    <div id="messageModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl max-w-md w-full p-6">
        <h2 class="text-xl font-bold mb-4">Send Message</h2>
        <textarea id="messageContent" rows="4" placeholder="Type your message..." class="w-full border border-gray-300 rounded-lg p-2"></textarea>
        <div class="flex justify-end gap-3 mt-4">
          <button onclick="closeMessageModal()" class="px-4 py-2 border border-gray-300 rounded-full">Cancel</button>
          <button onclick="sendMessage()" class="btn-primary">Send</button>
        </div>
      </div>
    </div>

    <div id="reportModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl max-w-md w-full p-6">
        <h2 class="text-xl font-bold mb-4">Report</h2>
        <textarea id="reportReason" rows="3" placeholder="Why are you reporting this?" class="w-full border border-gray-300 rounded-lg p-2"></textarea>
        <div class="flex justify-end gap-3 mt-4">
          <button onclick="closeReportModal()" class="px-4 py-2 border border-gray-300 rounded-full">Cancel</button>
          <button onclick="submitReport()" class="btn-primary">Submit Report</button>
        </div>
      </div>
    </div>

    <div id="jobModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl max-w-2xl w-full p-6">
        <h2 class="text-xl font-bold mb-4">Post a Job</h2>
        <input id="jobTitle" placeholder="Title" class="w-full mb-3 p-2 border border-gray-300 rounded-lg">
        <input id="jobEmployer" placeholder="Employer/Hospital" class="w-full mb-3 p-2 border border-gray-300 rounded-lg">
        <input id="jobLocation" placeholder="Location" class="w-full mb-3 p-2 border border-gray-300 rounded-lg">
        <textarea id="jobDescription" rows="4" placeholder="Description" class="w-full mb-3 p-2 border border-gray-300 rounded-lg"></textarea>
        <div class="flex justify-end gap-3">
          <button onclick="closeJobModal()" class="px-4 py-2 border border-gray-300 rounded-full">Cancel</button>
          <button onclick="createJob()" class="btn-primary">Publish</button>
        </div>
      </div>
    </div>

    <div id="eventModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl max-w-2xl w-full p-6">
        <h2 class="text-xl font-bold mb-4">Create Event</h2>
        <input id="eventTitle" placeholder="Title" class="w-full mb-3 p-2 border border-gray-300 rounded-lg">
        <input id="eventDate" type="datetime-local" class="w-full mb-3 p-2 border border-gray-300 rounded-lg">
        <input id="eventLocation" placeholder="Location or Virtual Link" class="w-full mb-3 p-2 border border-gray-300 rounded-lg">
        <textarea id="eventDescription" rows="3" placeholder="Description" class="w-full mb-3 p-2 border border-gray-300 rounded-lg"></textarea>
        <select id="eventType" class="w-full mb-3 p-2 border border-gray-300 rounded-lg">
          <option value="reunion">Reunion</option><option value="webinar">Webinar</option><option value="gala">Gala</option>
        </select>
        <div class="flex justify-end gap-3">
          <button onclick="closeEventModal()" class="px-4 py-2 border border-gray-300 rounded-full">Cancel</button>
          <button onclick="createEvent()" class="btn-primary">Create</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://shsvitucpxmutxyyuqfg.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_j2Xqe9mTX9RMO76wy1m3lg_pPlceFnA";
    let supabase;
    let currentUser = null;
    let currentProfile = null;
    let selectedImage = null;
    let editSelectedImage = null;
    let editPostId = null;
    let activeTab = 'feed';
    let validInviteCode = null;
    let reportTarget = null;

    function showToast(msg, isError = false) {
      const toast = document.createElement('div');
      toast.className = `fixed bottom-20 md:bottom-6 right-6 z-[10000] flex items-center gap-3 px-6 py-4 rounded-full font-semibold shadow-lg text-white transition-all duration-300 ${isError ? 'bg-red-600' : 'bg-[#0a66c2]'}`;
      toast.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i> ${msg}`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    // ---------- AUTH ----------
    async function verifyInviteCode() {
      const code = document.getElementById('inviteCode').value.trim();
      if (!code) { document.getElementById('errorMsg').innerText = "Enter an invite code"; return; }
      const { data, error } = await supabase.from('invite_codes').select('code, used').eq('code', code).maybeSingle();
      if (error || !data) { document.getElementById('errorMsg').innerText = "Invalid invite code"; return; }
      if (data.used) { document.getElementById('errorMsg').innerText = "This code has already been used"; return; }
      validInviteCode = code;
      document.getElementById('inviteStep').classList.add('hidden');
      document.getElementById('authStep').classList.remove('hidden');
      document.getElementById('errorMsg').innerText = "";
    }

    async function login() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) { document.getElementById('errorMsg').innerText = error.message; return; }
      document.getElementById('errorMsg').innerText = "";
      initApp(data.user);
    }

    async function signup() {
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) { document.getElementById('errorMsg').innerText = error.message; return; }
      await supabase.from('invite_codes').update({ used: true, used_by: data.user.id }).eq('code', validInviteCode);
      document.getElementById('errorMsg').innerText = "";
      initApp(data.user);
    }

    async function logout() {
      await supabase.auth.signOut();
      location.reload();
    }

    async function initApp(user) {
      currentUser = user;
      const { data: profile, error } = await supabase.from('profiles').select('*').eq('user_id', user.id).maybeSingle();
      if (error) console.error(error);
      if (!profile) showOnboarding();
      else {
        currentProfile = profile;
        document.getElementById('userNameDisplay').innerText = profile.full_name.split(' ')[0];
        document.querySelector('#profileBtn div').innerText = profile.full_name.charAt(0);
        document.getElementById('authContainer').classList.add('hidden');
        document.getElementById('appContainer').classList.remove('hidden');
        if (profile.is_admin) {
          document.getElementById('navAdmin').classList.remove('hidden');
          document.getElementById('mobileAdmin').classList.remove('hidden');
        }
        loadView(activeTab);
        setupRealtime();
      }
    }

    function showOnboarding() {
      const modal = document.createElement('div');
      modal.className = "fixed inset-0 bg-black/50 flex items-center justify-center z-50";
      modal.innerHTML = `
        <div class="bg-white rounded-2xl max-w-md w-full p-6 animate-fade-up">
          <h2 class="text-2xl font-bold mb-4">Complete Your Profile</h2>
          <form id="onboardForm">
            <input id="fullName" placeholder="Full Name" class="w-full mb-3 p-2 border border-gray-300 rounded-lg" required>
            <input id="email" placeholder="Email" class="w-full mb-3 p-2 border border-gray-300 rounded-lg" required>
            <input id="gradYear" placeholder="Graduation Year" class="w-full mb-3 p-2 border border-gray-300 rounded-lg">
            <input id="specialty" placeholder="Specialty" class="w-full mb-3 p-2 border border-gray-300 rounded-lg">
            <input id="workplace" placeholder="Workplace" class="w-full mb-3 p-2 border border-gray-300 rounded-lg">
            <textarea id="bio" rows="2" placeholder="Bio" class="w-full mb-3 p-2 border border-gray-300 rounded-lg"></textarea>
            <label class="flex items-center gap-2 mb-4"><input type="checkbox" id="oath"> I affirm the Camillian Oath</label>
            <button type="submit" class="btn-primary w-full">Save Profile</button>
          </form>
        </div>`;
      document.body.appendChild(modal);
      document.getElementById('onboardForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!document.getElementById('oath').checked) { showToast("You must affirm the oath", true); return; }
        const { error } = await supabase.from('profiles').insert({
          user_id: currentUser.id,
          full_name: document.getElementById('fullName').value,
          email: document.getElementById('email').value,
          graduation_year: parseInt(document.getElementById('gradYear').value) || null,
          specialty: document.getElementById('specialty').value,
          workplace: document.getElementById('workplace').value,
          bio: document.getElementById('bio').value,
          oath_affirmed: true,
          is_verified: document.getElementById('email').value.endsWith('@camillus.edu')
        });
        if (error) showToast(error.message, true);
        else { modal.remove(); initApp(currentUser); }
      });
    }

    // ---------- VIEW HANDLER ----------
    async function loadView(view) {
      activeTab = view;
      const container = document.getElementById('appContent');
      container.innerHTML = `<div class="flex justify-center py-20"><i class="fa-solid fa-spinner fa-spin text-3xl text-[#0a66c2]"></i></div>`;
      if (view === 'feed') await renderFeed();
      else if (view === 'directory') await renderDirectory();
      else if (view === 'jobs') await renderJobs();
      else if (view === 'mentorship') await renderMentorship();
      else if (view === 'events') await renderEvents();
      else if (view === 'profile') await renderProfile();
      else if (view === 'messages') await renderMessages();
      else if (view === 'admin') await renderAdminDashboard();
      document.querySelectorAll('.tab-btn, #mobileFeed, #mobileDirectory, #mobileJobs, #mobileMentorship, #mobileEvents, #mobileMessages, #mobileAdmin').forEach(btn => btn.classList.remove('tab-active', 'text-[#0a66c2]'));
      if (view === 'feed') document.querySelectorAll('#navFeed, #mobileFeed').forEach(btn => btn.classList.add('tab-active', 'text-[#0a66c2]'));
      else if (view === 'directory') document.querySelectorAll('#navDirectory, #mobileDirectory').forEach(btn => btn.classList.add('tab-active', 'text-[#0a66c2]'));
      else if (view === 'jobs') document.querySelectorAll('#navJobs, #mobileJobs').forEach(btn => btn.classList.add('tab-active', 'text-[#0a66c2]'));
      else if (view === 'mentorship') document.querySelectorAll('#navMentorship, #mobileMentorship').forEach(btn => btn.classList.add('tab-active', 'text-[#0a66c2]'));
      else if (view === 'events') document.querySelectorAll('#navEvents, #mobileEvents').forEach(btn => btn.classList.add('tab-active', 'text-[#0a66c2]'));
      else if (view === 'messages') document.querySelectorAll('#navMessages, #mobileMessages').forEach(btn => btn.classList.add('tab-active', 'text-[#0a66c2]'));

    // ---------- FEED (with likes, saves, edit, report) ----------
    async function renderFeed() {
      const { data: posts, error } = await supabase.from('posts').select('*, profiles!user_id(full_name, avatar_url, specialty)').order('created_at', { ascending: false });
      if (error) throw error;

      const enriched = await Promise.all(posts.map(async (post) => {
        const { count: likeCount } = await supabase.from('post_likes').select('*', { count: 'exact', head: true }).eq('post_id', post.id);
        const { data: userLike } = await supabase.from('post_likes').select('id').eq('post_id', post.id).eq('user_id', currentUser.id).maybeSingle();
        const { data: saved } = await supabase.from('saved_posts').select('id').eq('user_id', currentUser.id).eq('post_id', post.id).maybeSingle();
        return { ...post, likeCount: likeCount || 0, userLiked: !!userLike, saved: !!saved };
      }));

      const html = `
        <div class="mb-6 flex justify-between items-center">
          <div class="flex gap-2">
            <button onclick="openPostModal()" class="btn-primary"><i class="fa-regular fa-pen-to-square mr-2"></i> Create Post</button>
            <button onclick="loadView('feedSaved')" class="btn-outline"><i class="fa-regular fa-bookmark mr-2"></i> Saved</button>
          </div>
          <select id="feedFilter" class="border border-gray-300 rounded-full px-4 py-2 text-sm">
            <option value="">All Specialties</option>
            <option>ICU</option><option>ER</option><option>Pediatrics</option><option>Oncology</option>
          </select>
        </div>
        <div id="feedList" class="space-y-4"></div>
      `;
      document.getElementById('appContent').innerHTML = html;
      const feedDiv = document.getElementById('feedList');
      feedDiv.innerHTML = enriched.map(post => `
        <div class="bg-white rounded-xl border border-gray-200 p-3 flex post-card transition-all">
          <div class="vote-column mr-3">
            <div class="vote-arrow" onclick="votePost('${post.id}', 'up')">▲</div>
            <div class="vote-count">${post.upvotes || 0}</div>
            <div class="vote-arrow" onclick="votePost('${post.id}', 'down')">▼</div>
          </div>
          <div class="flex-1">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2 text-xs text-gray-500 mb-1">
                <span>Posted by ${post.is_anonymous ? 'Anonymous' : (post.profiles?.full_name || 'Alumni')}</span>
                <span>•</span>
                <span>${post.profiles?.specialty || 'General'}</span>
                <span>•</span>
                <span>${new Date(post.created_at).toLocaleString()}</span>
                ${post.edited_at ? `<span>• edited</span>` : ''}
              </div>
              <div class="dropdown">
                <i class="fa-solid fa-ellipsis-vertical cursor-pointer text-gray-400 hover:text-gray-600" onclick="toggleDropdown(this)"></i>
                <div class="dropdown-content">
                  ${post.user_id === currentUser.id ? `<a href="#" onclick="editPost('${post.id}', '${escapeHtml(post.content)}', ${post.is_anonymous}, '${post.specialty_tag || ''}')">Edit</a>` : ''}
                  <a href="#" onclick="reportTargetFunc('post', '${post.id}')">Report</a>
                </div>
              </div>
            </div>
            <div class="text-gray-800 mb-2">${escapeHtml(post.content)}</div>
            ${post.image_url ? `<div class="mt-2 rounded-lg overflow-hidden"><img src="${post.image_url}" class="w-full max-h-96 object-cover"></div>` : ''}
            <div class="flex gap-4 mt-3 text-sm">
              <button onclick="toggleLike('${post.id}')" class="like-btn ${post.userLiked ? 'text-red-500' : 'text-gray-500'} hover:text-red-500">
                <i class="fa-regular fa-heart"></i> ${post.likeCount}
              </button>
              <button onclick="toggleSave('${post.id}')" class="save-btn ${post.saved ? 'text-yellow-500' : 'text-gray-500'} hover:text-yellow-500">
                <i class="fa-regular fa-bookmark"></i>
              </button>
              <button onclick="toggleComments('${post.id}')" class="text-gray-500 hover:text-[#0a66c2]"><i class="fa-regular fa-comment"></i> Comment</button>
            </div>
            <div id="comments-${post.id}" class="hidden mt-3 pl-4 border-l-2 border-gray-200 space-y-2"></div>
          </div>

    async function votePost(postId, type) {
      const { error } = await supabase.from('votes').upsert({ post_id: postId, user_id: currentUser.id, vote_type: type }, { onConflict: 'post_id, user_id' });
      if (error) showToast(error.message, true);
      else renderFeed();
    }

    async function toggleLike(postId) {
      const { data: existing } = await supabase.from('post_likes').select('id').eq('post_id', postId).eq('user_id', currentUser.id).maybeSingle();
      if (existing) {
        await supabase.from('post_likes').delete().eq('id', existing.id);
      } else {
        await supabase.from('post_likes').insert({ post_id: postId, user_id: currentUser.id });
      }
      renderFeed();
    }

    async function toggleSave(postId) {
      const { data: existing } = await supabase.from('saved_posts').select('id').eq('user_id', currentUser.id).eq('post_id', postId).maybeSingle();
      if (existing) {
        await supabase.from('saved_posts').delete().eq('id', existing.id);
        showToast("Removed from saved");
      } else {
        await supabase.from('saved_posts').insert({ user_id: currentUser.id, post_id: postId });
        showToast("Saved post");
      }
      renderFeed();
    }

    async function toggleComments(postId) {
      const container = document.getElementById(`comments-${postId}`);
      if (container.style.display !== 'none') { container.style.display = 'none'; return; }
      const { data: comments, error } = await supabase.from('comments').select('*, profiles!user_id(full_name)').eq('post_id', postId).order('created_at', { ascending: true });
      if (error) return;

      const enriched = await Promise.all(comments.map(async (c) => {
        const { data: vote } = await supabase.from('comment_votes').select('vote_type').eq('comment_id', c.id).eq('user_id', currentUser.id).maybeSingle();
        const { data: scoreData } = await supabase.from('comments').select('score').eq('id', c.id).single();
        return { ...c, userVote: vote?.vote_type, score: scoreData?.score || 0 };
      }));

      container.innerHTML = enriched.map(c => `
        <div id="comment-${c.id}" class="text-sm bg-gray-50 rounded p-2" data-post-id="${postId}">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <strong>${c.profiles?.full_name}</strong>
              <span class="text-xs text-gray-400">${new Date(c.created_at).toLocaleString()}</span>
            </div>
            <div class="dropdown">
              <i class="fa-solid fa-ellipsis-vertical cursor-pointer text-gray-400 text-xs" onclick="toggleDropdown(this)"></i>
              <div class="dropdown-content">
                <a href="#" onclick="reportTargetFunc('comment', '${c.id}')">Report</a>
              </div>
            </div>
          </div>
          <div class="mt-1">${c.content}</div>
          <div class="flex items-center gap-2 mt-1 text-xs">
            <button class="comment-vote ${c.userVote === 'up' ? 'text-green-600' : ''}" onclick="voteComment('${c.id}', 'up')">▲ ${c.score}</button>
            <button class="comment-vote ${c.userVote === 'down' ? 'text-red-600' : ''}" onclick="voteComment('${c.id}', 'down')">▼</button>
          </div>
        </div>
      `).join('') + `
        <textarea id="newComment-${postId}" class="w-full mt-2 p-2 border border-gray-300 rounded-lg text-sm" rows="2" placeholder="Add a comment..."></textarea>
        <button onclick="addComment('${postId}')" class="mt-1 bg-gray-200 px-3 py-1 rounded-full text-xs">Post</button>
      `;
      container.style.display = 'block';
    }

    async function voteComment(commentId, voteType) {
      const { error } = await supabase.from('comment_votes').upsert({ comment_id: commentId, user_id: currentUser.id, vote_type: voteType }, { onConflict: 'comment_id, user_id' });
      if (error) showToast(error.message, true);
      else {
        const commentDiv = document.getElementById(`comment-${commentId}`);
        const postId = commentDiv?.dataset.postId;
        if (postId) toggleComments(postId);
      }
    }

    async function addComment(postId) {
      const content = document.getElementById(`newComment-${postId}`).value;
      if (!content) return;
      await supabase.from('comments').insert({ post_id: postId, user_id: currentUser.id, username: currentProfile.full_name, content });
      toggleComments(postId);
    }

    function editPost(postId, content, isAnonymous, specialty) {
      editPostId = postId;
      document.getElementById('editPostContent').value = content;
      document.getElementById('editAnonymousPost').checked = isAnonymous;
      document.getElementById('editPostSpecialty').value = specialty;
      document.getElementById('editPostModal').classList.remove('hidden');
    }

    function handleEditImageSelect(e) { editSelectedImage = e.target.files[0]; document.getElementById('editImageNameDisplay').innerHTML = editSelectedImage ? editSelectedImage.name : ''; }
    async function saveEditedPost() {
      const newContent = document.getElementById('editPostContent').value.trim();
      if (!newContent) return showToast("Content cannot be empty", true);
      let imageUrl = null;
      if (editSelectedImage) {
        const fileName = `${currentUser.id}_${Date.now()}.${editSelectedImage.name.split('.').pop()}`;
        const { error: upErr } = await supabase.storage.from('post-images').upload(fileName, editSelectedImage);
        if (!upErr) imageUrl = supabase.storage.from('post-images').getPublicUrl(fileName).data.publicUrl;
        else console.error(upErr);
      }
      const isAnonymous = document.getElementById('editAnonymousPost').checked;
      const specialtyTag = document.getElementById('editPostSpecialty').value;
      const { error } = await supabase.from('posts').update({
        content: newContent,
        image_url: imageUrl,
        is_anonymous: isAnonymous,
        specialty_tag: specialtyTag,
        edited_at: new Date()
      }).eq('id', editPostId);
      if (error) showToast(error.message, true);
      else { closeEditPostModal(); renderFeed(); showToast("Post updated"); }
    }
    function closeEditPostModal() { document.getElementById('editPostModal').classList.add('hidden'); editSelectedImage = null; document.getElementById('editImageNameDisplay').innerHTML = ''; }

    // ---------- MESSAGES ----------
    let currentRecipientId = null;
    function openMessageModal(recipientId) { currentRecipientId = recipientId; document.getElementById('messageModal').classList.remove('hidden'); }
    function closeMessageModal() { document.getElementById('messageModal').classList.add('hidden'); document.getElementById('messageContent').value = ''; }
    async function sendMessage() {
      const content = document.getElementById('messageContent').value.trim();
      if (!content) return showToast("Message cannot be empty", true);
      const { error } = await supabase.from('messages').insert({ sender_id: currentUser.id, recipient_id: currentRecipientId, content });
      if (error) showToast(error.message, true);
      else { closeMessageModal(); showToast("Message sent"); }
    }

    async function renderMessages() {
      const { data: messages, error } = await supabase
        .from('messages')
        .select('*, sender:profiles!sender_id(full_name), recipient:profiles!recipient_id(full_name)')
        .or(`sender_id.eq.${currentUser.id},recipient_id.eq.${currentUser.id}`)
        .order('created_at', { ascending: false });
      if (error) throw error;

      const conversations = {};
      messages.forEach(m => {
        const otherId = m.sender_id === currentUser.id ? m.recipient_id : m.sender_id;
        const otherName = m.sender_id === currentUser.id ? m.recipient.full_name : m.sender.full_name;
        if (!conversations[otherId] || new Date(m.created_at) > new Date(conversations[otherId].created_at)) {
          conversations[otherId] = { ...m, otherName, otherId };
        }
      });

      const html = `
        <h2 class="text-2xl font-bold mb-6">Messages</h2>
        <div class="space-y-4">
          ${Object.values(conversations).map(conv => `
            <div class="bg-white rounded-xl border border-gray-200 p-4 flex justify-between items-center">
              <div><strong>${conv.otherName}</strong><div class="text-sm text-gray-500">${conv.content.substring(0, 50)}</div></div>
              <button onclick="openMessageModal('${conv.otherId}')" class="btn-primary text-sm">Reply</button>
            </div>
          `).join('')}
          ${Object.keys(conversations).length === 0 ? '<p class="text-gray-500">No messages yet. Start a conversation from the directory.</p>' : ''}
        </div>
      `;
      document.getElementById('appContent').innerHTML = html;
    }

    async function createInviteCode() { const code = document.getElementById('newInviteCode').value.trim(); if (code) await supabase.from('invite_codes').insert({ code }); renderAdminDashboard(); }
    async function deleteInviteCode(id) { await supabase.from('invite_codes').delete().eq('id', id); renderAdminDashboard(); }

    // ---------- HELPER ACTIONS ----------
    async function follow(userId) { await supabase.from('follows').upsert({ follower_id: currentUser.id, followee_id: userId }); showToast("Followed"); }
    async function requestMentorship(mentorId) { await supabase.from('mentorship_connections').insert({ mentor_id: mentorId, mentee_id: currentUser.id, status: 'pending' }); showToast("Request sent"); }
    async function updateMentorship(connId, action) { await supabase.from('mentorship_connections').update({ status: action === 'accept' ? 'active' : 'rejected' }).eq('id', connId); renderMentorship(); }
    function applyJob(jobId) { showToast("Apply feature coming soon – contact poster directly"); }
    function addEndorsement() { showToast("Endorsement feature coming soon"); }
    function editProfile() { showToast("Profile editing coming soon"); }

    // ---------- POST, JOB, EVENT MODALS ----------
    function openPostModal() { document.getElementById('postModal').classList.remove('hidden'); }
    function closePostModal() { document.getElementById('postModal').classList.add('hidden'); selectedImage = null; document.getElementById('imageNameDisplay').innerHTML = ''; document.getElementById('postImage').value = ''; }
    function handleImageSelect(e) { selectedImage = e.target.files[0]; document.getElementById('imageNameDisplay').innerHTML = selectedImage ? selectedImage.name : ''; }
    async function publishPost() {
      const content = document.getElementById('postContent').value.trim();
      if (!content) { showToast("Write something", true); return; }
      if (!currentProfile) { showToast("Profile not loaded", true); return; }
      let imageUrl = null;
      if (selectedImage) {
        const fileName = `${currentUser.id}_${Date.now()}.${selectedImage.name.split('.').pop()}`;
        const { error: upErr } = await supabase.storage.from('post-images').upload(fileName, selectedImage);
        if (!upErr) imageUrl = supabase.storage.from('post-images').getPublicUrl(fileName).data.publicUrl;
        else console.error(upErr);
      }
      const isAnonymous = document.getElementById('anonymousPost').checked;
      const specialtyTag = document.getElementById('postSpecialty').value;
      const { error } = await supabase.from('posts').insert({
        user_id: currentUser.id,
        username: isAnonymous ? 'Anonymous' : currentProfile.full_name,
        content,
        image_url: imageUrl,
        is_anonymous: isAnonymous,
        specialty_tag: specialtyTag || null
      });
      if (error) showToast("Failed to post: " + error.message, true);
      else { closePostModal(); loadView('feed'); showToast("Post published!"); }
    }

    function openJobModal() { document.getElementById('jobModal').classList.remove('hidden'); }
    function closeJobModal() { document.getElementById('jobModal').classList.add('hidden'); }
    async function createJob() {
      const title = document.getElementById('jobTitle').value;
      if (!title) { showToast("Title required", true); return; }
      await supabase.from('jobs').insert({
        title, employer: document.getElementById('jobEmployer').value,
        location: document.getElementById('jobLocation').value,
        description: document.getElementById('jobDescription').value,
        posted_by: currentUser.id
      });
      closeJobModal(); loadView('jobs'); showToast("Job posted");
    }
    function openEventModal() { document.getElementById('eventModal').classList.remove('hidden'); }
    function closeEventModal() { document.getElementById('eventModal').classList.add('hidden'); }
    async function createEvent() {
      const title = document.getElementById('eventTitle').value;
      if (!title) { showToast("Title required", true); return; }
      await supabase.from('events').insert({
        title, description: document.getElementById('eventDescription').value,
        start_time: document.getElementById('eventDate').value,
        location: document.getElementById('eventLocation').value,
        event_type: document.getElementById('eventType').value,
        organizer_id: currentUser.id
      });
      closeEventModal(); loadView('events'); showToast("Event created");
    }

    // ---------- NOTIFICATIONS & REALTIME ----------
    function setupRealtime() {
      supabase.channel('public')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => { if (activeTab === 'feed') renderFeed(); })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `recipient_id=eq.${currentUser.id}` }, () => { if (activeTab === 'messages') renderMessages(); })
        .subscribe();
    }

    function filterFeed() {}
    function toggleDropdown(btn) { const dropdown = btn.nextElementSibling; dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block'; window.addEventListener('click', function close(e) { if (!btn.contains(e.target) && !dropdown.contains(e.target)) { dropdown.style.display = 'none'; window.removeEventListener('click', close); } }); }

    // ---------- EVENT LISTENERS ----------
    document.getElementById('showLoginBtn')?.addEventListener('click', () => {
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('signupForm').classList.add('hidden');
      document.getElementById('showLoginBtn').classList.add('border-b-2', 'border-[#0a66c2]', 'font-semibold');
      document.getElementById('showSignupBtn').classList.remove('border-b-2', 'border-[#0a66c2]', 'font-semibold');
    });
    document.getElementById('showSignupBtn')?.addEventListener('click', () => {
      document.getElementById('signupForm').classList.remove('hidden');
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('showSignupBtn').classList.add('border-b-2', 'border-[#0a66c2]', 'font-semibold');
      document.getElementById('showLoginBtn').classList.remove('border-b-2', 'border-[#0a66c2]', 'font-semibold');
    });
    document.getElementById('logoutBtn')?.addEventListener('click', logout);
    document.getElementById('navFeed')?.addEventListener('click', () => loadView('feed'));
    document.getElementById('navDirectory')?.addEventListener('click', () => loadView('directory'));
    document.getElementById('navJobs')?.addEventListener('click', () => loadView('jobs'));
    document.getElementById('navMentorship')?.addEventListener('click', () => loadView('mentorship'));
    document.getElementById('navEvents')?.addEventListener('click', () => loadView('events'));
    document.getElementById('navMessages')?.addEventListener('click', () => loadView('messages'));
    document.getElementById('navAdmin')?.addEventListener('click', () => loadView('admin'));
    document.getElementById('profileBtn')?.addEventListener('click', () => loadView('profile'));
    document.getElementById('mobileFeed')?.addEventListener('click', () => loadView('feed'));
    document.getElementById('mobileDirectory')?.addEventListener('click', () => loadView('directory'));
    document.getElementById('mobileJobs')?.addEventListener('click', () => loadView('jobs'));
    document.getElementById('mobileMentorship')?.addEventListener('click', () => loadView('mentorship'));
    document.getElementById('mobileEvents')?.addEventListener('click', () => loadView('events'));
    document.getElementById('mobileMessages')?.addEventListener('click', () => loadView('messages'));
    document.getElementById('mobileAdmin')?.addEventListener('click', () => loadView('admin'));

    async function init() {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const session = await supabase.auth.getSession();
      if (session.data.session) initApp(session.data.session.user);
      else { document.getElementById('authContainer').classList.remove('hidden'); document.getElementById('appContainer').classList.add('hidden'); }
    }
    init();

    // Global exports for onclick
    window.verifyInviteCode = verifyInviteCode;
    window.login = login;
    window.signup = signup;
    window.openPostModal = openPostModal;
    window.closePostModal = closePostModal;
    window.publishPost = publishPost;
    window.handleImageSelect = handleImageSelect;
    window.votePost = votePost;
    window.toggleLike = toggleLike;
    window.toggleSave = toggleSave;
    window.toggleComments = toggleComments;
    window.voteComment = voteComment;
    window.addComment = addComment;
    window.editPost = editPost;
    window.handleEditImageSelect = handleEditImageSelect;
    window.saveEditedPost = saveEditedPost;
    window.closeEditPostModal = closeEditPostModal;
    window.openMessageModal = openMessageModal;
    window.closeMessageModal = closeMessageModal;
    window.sendMessage = sendMessage;
    window.reportTargetFunc = reportTargetFunc;
    window.closeReportModal = closeReportModal;
    window.submitReport = submitReport;
    window.follow = follow;
    window.requestMentorship = requestMentorship;
    window.updateMentorship = updateMentorship;
    window.applyJob = applyJob;
    window.openJobModal = openJobModal;
    window.closeJobModal = closeJobModal;
    window.createJob = createJob;
    window.openEventModal = openEventModal;
    window.closeEventModal = closeEventModal;
    window.createEvent = createEvent;
    window.editProfile = editProfile;
    window.addEndorsement = addEndorsement;
    window.toggleDropdown = toggleDropdown;
    window.createInviteCode = createInviteCode;
    window.deleteInviteCode = deleteInviteCode;
  </script>
</body>
